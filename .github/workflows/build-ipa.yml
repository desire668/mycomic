name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: MyComic.xcodeproj
  SCHEME: MyComic
  CONFIGURATION: Release
  APP_PATH: build/Build/Products/Release-iphoneos/MyComic.app
  IPA_NAME: MyComic-unsigned.ipa

jobs:
  test:
    name: Unit tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro Max| Pro| Plus| mini)?' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator found; available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Report test errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f test.log ]; then
            echo "test.log missing"
            exit 0
          fi
          {
            echo "Test failure report for \`${{ github.sha }}\`"
            echo ''
            echo '```'
            grep -nE "error:|Test Case .*failed|Failing tests|TEST FAILED|xcodebuild: error" test.log | cut -c1-500 | head -60 || true
            echo '```'
          } > test-comment.md
          wc -c test-comment.md
          cat test-comment.md
          jq -Rs '{body: .}' test-comment.md > test-payload.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @test-payload.json || echo "comment post failed"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build MyComic (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          ls -1 /Applications | grep -i xcode || true
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Resolve project and scheme
        run: |
          ls -la
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f build.log ]; then
            echo "build.log missing"
            exit 0
          fi
          {
            echo "Build failure report for \`${{ github.sha }}\`"
            echo ''
            echo '```'
            grep -nE "error:|error\)|xcodebuild: error|BUILD FAILED|fatal error" build.log | head -120 || true
            echo '```'
          } > comment.md
          cat comment.md
          jq -Rs '{body: .}' comment.md > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @payload.json

      - name: Verify .app bundle
        run: |
          set -euo pipefail
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/MyComic"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.mycomic.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "15.0"
          plutil -lint "$APP_PATH/Info.plist"
          ls -la "$APP_PATH"

      - name: Package .app into Payload and zip IPA
        run: |
          set -euo pipefail
          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"

      - name: Verify IPA structure
        run: |
          set -euo pipefail
          test -f "$IPA_NAME"
          unzip -t "$IPA_NAME"
          unzip -l "$IPA_NAME" | head -30
          unzip -l "$IPA_NAME" | grep -q "Payload/MyComic.app/MyComic"
          unzip -l "$IPA_NAME" | grep -q "Payload/MyComic.app/Info.plist"
          test "$(unzip -Z1 "$IPA_NAME" | head -1)" = "Payload/"
          echo "IPA_OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyComic-unsigned-ipa
          path: MyComic-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish rolling prerelease IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unsigned-latest
          name: MyComic unsigned (latest)
          body: |
            自动构建的未签名 IPA，每次 push 到 main 成功后更新。
            未签名 IPA 需使用 AltStore / SideStore / Sideloadly / 爱思助手自行签名安装。
          prerelease: true
          make_latest: "false"
          files: MyComic-unsigned.ipa
          fail_on_unmatched_files: true

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MyComic-unsigned.ipa
          fail_on_unmatched_files: true
